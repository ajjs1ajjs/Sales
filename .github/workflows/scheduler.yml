name: Update Deals and Deploy

on:
  schedule:
    - cron: '0 9,15,18,21 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/data/deals.json'
      - 'public/data/notified-history.json'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: fetch-deals
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Fetch latest deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx scripts/fetch-deals.ts

      - name: Commit and push updated deals.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/deals.json public/data/notified-history.json
          if git diff-index --quiet HEAD; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update deals data [skip ci]"
          # Another run may have pushed while we were fetching — rebase first.
          # Generated data files always resolve to the fresh run ("theirs").
          git pull --rebase --autostash origin main || {
            git checkout --theirs -- public/data/deals.json public/data/notified-history.json
            git add public/data/deals.json public/data/notified-history.json
            GIT_EDITOR=true git rebase --continue
          }
          git push origin main

      - name: Build React App
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          external_repository: ajjs1ajjs/Sales
          publish_dir: ./dist
          publish_branch: gh-pages

  auto-release:
    needs: build-and-deploy
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create dated release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="auto-$(date -u +%F)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "Automated release $TAG" --generate-notes --target main
