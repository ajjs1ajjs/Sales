name: Release

# Builds the PWA and publishes it to the public ajjs1ajjs/dist repo at /sales
# (GitHub Pages). Runs on every push to main (real code changes), on a daily
# schedule, and manually from the Actions tab.
#
# The source code lives in this PRIVATE repo; the site + deals data are public
# in ajjs1ajjs/dist. Deals data (sales/data/) is owned by dist's
# sales-scheduler.yml, so it is preserved here — only the app shell is replaced.
#
# If a run finds no site changes (e.g. a scheduled rebuild with unchanged code)
# it publishes nothing and cuts no tag; only real changes bump the version and
# create a `sales-v<semver>` release in the dist repo.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'public/data/**'
  schedule:
    # Daily rebuild/rescue run at 05:17 UTC (~08:17 Kyiv). The first tick after
    # the Actions billing/limit reset on Oct 1 republishes the current build.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Explicit x.y.z (overrides bump)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-sales
  cancel-in-progress: false

jobs:
  release:
    name: Build PWA and publish to dist/sales
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve next version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          DIST_REPO: ajjs1ajjs/dist
          PREFIX: sales-v
          INPUT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            NEXT="$INPUT_VERSION"
          else
            LATEST=$(gh release list --repo "$DIST_REPO" --limit 200 --json tagName --jq '.[].tagName' \
              | grep -E "^${PREFIX}[0-9]+\.[0-9]+\.[0-9]+$" | sed "s/^${PREFIX}//" | sort -V | tail -n1 || true)
            [ -n "$LATEST" ] || LATEST="0.0.0"
            NEXT=$(echo "$LATEST" | awk -F. -v b="${BUMP:-patch}" '{ if (b=="major") printf "%d.0.0",$1+1; else if (b=="minor") printf "%d.%d.0",$1,$2+1; else printf "%d.%d.%d",$1,$2,$3+1 }')
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=${PREFIX}${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${PREFIX}${NEXT}"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Compare the fresh build with what is live; skip bumping/tagging when
      # nothing changed so scheduled rebuilds stay idempotent.
      - name: Publish site to ajjs1ajjs/dist
        id: publish
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          DIST_REPO: ajjs1ajjs/dist
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::PUBLIC_RELEASE_TOKEN is not set"; exit 1; }
          tmp="$RUNNER_TEMP/dist-sales"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${DIST_REPO}.git" "$tmp" --depth 1
          mkdir -p "$tmp/sales"
          # Deals data (sales/data/) is owned by dist's scheduler — preserve it.
          rsync -a --delete --exclude 'data/' --exclude '.nojekyll' dist/ "$tmp/sales/"
          cd "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sales
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No site changes to publish."
          else
            git commit -m "chore(sales): publish site build ($TAG)"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Published $TAG build."
          fi

      # Cut a release tag + bump the source version only when something shipped.
      - name: Create release tag
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          DIST_REPO: ajjs1ajjs/dist
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$DIST_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --repo "$DIST_REPO" --title "Game Sales $TAG" --generate-notes
          fi

      - name: Bump version in source
        if: steps.publish.outputs.changed == 'true'
        continue-on-error: true
        env:
          NEXT: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.NEXT;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(release): $TAG [skip ci]"
          git push
